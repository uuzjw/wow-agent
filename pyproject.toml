[project]
name = "wow-agent"
version = "0.6.0"
description = "A terminal coding agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "uuzjw" }]
requires-python = ">=3.10"
dependencies = [
    "httpx[socks]>=0.27",
    "openai>=1.40",
    "pillow>=10",
    "prompt_toolkit>=3.0",
    "rich>=13",
]

[project.scripts]
wow = "wow_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wow_agent"]
